openapi: 3.1.0

info:
  title: Smith API
  version: "1.0.0"
  summary: Construction networking platform — REST API
  description: |
    The Smith API powers all client surfaces — web, mobile (future), and any
    integrations.

    **This API is governed by the additive-only commandment**
    (see `docs/API_COMMANDMENT.md`). Briefly: fields are never renamed,
    endpoints are never moved, required fields are never added. New behavior
    ships as new endpoints or new optional fields.

    ## Authentication
    Every endpoint except the auth endpoints requires a Bearer token in the
    `Authorization` header. Tokens are obtained via `/api/auth/signin` or
    `/api/auth/signup`.

    ## Versioning
    All clients should send a `Smith-Version` header containing the date
    of their build (e.g. `Smith-Version: 2026-05-19`). The server currently
    ignores this header but the plumbing is in place; if we ever need to
    gate behavior by client build date we can.

    ## Pagination
    List endpoints accept `limit` and `offset` query params. Defaults vary
    per endpoint (documented inline). The shape of each list response is
    `{ "items": [...] }` where the field name (`items`, `articles`,
    `connections`, `posts`, …) is endpoint-specific and never changes.

  contact:
    name: Smith Engineering
    url: https://github.com/bryanhollingshead/smith
  license:
    name: Proprietary

servers:
  - url: http://localhost:4000
    description: Local development
  - url: https://api.smith.app
    description: Production (planned)

tags:
  - name: Auth
    description: Sign-up, sign-in, password reset, email verification.
  - name: Profiles
    description: User profile reads & edits. Trades, skills, credentials live here too.
  - name: Companies
    description: Company directory + work history (a tenure at a company) + jobsites.
  - name: Connections
    description: Network — connections, pending requests, suggestions.
  - name: Posts
    description: Feed posts, likes, comments.
  - name: Messages
    description: 1:1 direct messages between connections.
  - name: News
    description: Industry news feed — articles, categories, saved-for-later.
  - name: Search
    description: Unified search across users, companies, jobsites, trades.
  - name: Notifications
    description: In-app notification bell.
  - name: Credential Docs
    description: Upload & serve license / insurance documents.
  - name: Misc
    description: Trades catalog, health, etc.
  - name: Admin
    description: Admin-only endpoints (news feed management, etc.). Require `is_admin = TRUE`.
  - name: Dev
    description: Development-only endpoints. Disabled in production.

paths:
  # ───────────────────────────────────────────────────────────────────────
  # Health
  # ───────────────────────────────────────────────────────────────────────
  /api/health:
    get:
      tags: [Misc]
      summary: Service health check
      description: |
        Lightweight ping. No auth required. Used by deployment platforms
        (Render, etc.) for healthcheck probes.
      security: []
      responses:
        '200':
          description: Service is up.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
                  t: { type: integer, description: "Server time as ms since epoch." }

  # ───────────────────────────────────────────────────────────────────────
  # Auth
  # ───────────────────────────────────────────────────────────────────────
  /api/auth/signup:
    post:
      tags: [Auth]
      summary: Create a new account
      description: |
        Creates an unverified user, issues a 6-digit verification code, and
        sends it to the supplied email. Returns a JWT so the client can hit
        verification endpoints while signed in.

        **Idempotent for unverified accounts:** signing up again with the
        same email re-issues the verification code rather than failing.

        Returns 409 only when the email is already verified.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password:
                  type: string
                  description: 12+ chars, must include at least one number.
                  minLength: 12
                first_name: { type: string }
                last_name: { type: string }
      responses:
        '201':
          description: Account created (or verification code re-sent).
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  token: { type: string, description: JWT. Present on new signups, absent on resends. }
                  status: { type: string, enum: [verification_resent], description: Present only on resend. }
                  user: { $ref: '#/components/schemas/UserMinimal' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409':
          description: Email already in use AND verified.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/auth/verify-email:
    post:
      tags: [Auth]
      summary: Confirm email with 6-digit code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, pattern: '^\d{6}$' }
      responses:
        '200':
          description: Verified.
          content:
            application/json:
              schema:
                type: object
                properties: { ok: { type: boolean } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/auth/resend-code:
    post:
      tags: [Auth]
      summary: Re-send the email verification code
      responses:
        '200':
          description: Code sent (or already verified, no-op).
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  already_verified: { type: boolean }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/auth/signin:
    post:
      tags: [Auth]
      summary: Sign in with email + password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        '200':
          description: Signed in.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  token: { type: string }
                  user: { $ref: '#/components/schemas/UserMinimal' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401':
          description: Invalid credentials. Returned even if the email doesn't exist (no enumeration).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/auth/forgot:
    post:
      tags: [Auth]
      summary: Request a password reset email
      description: |
        Always returns 200 — never confirms whether the address is on file
        (to avoid email enumeration).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '200':
          description: Acknowledged. (Email sent only if address is on file.)
          content:
            application/json:
              schema:
                type: object
                properties: { ok: { type: boolean } }

  /api/auth/reset:
    post:
      tags: [Auth]
      summary: Complete password reset
      description: |
        Consumes the token from the reset email. On success, all other sessions
        for the user are revoked and a fresh JWT is returned.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token: { type: string }
                password: { type: string, minLength: 12 }
      responses:
        '200':
          description: Password reset; user signed in.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  token: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }

  /api/auth/me:
    get:
      tags: [Auth]
      summary: Get the currently-authenticated user (basic fields)
      description: |
        Lightweight read. For full profile data, use `/api/profiles/me`.
      responses:
        '200':
          description: Current user.
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: '#/components/schemas/UserSelf' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/auth/dev/last-email:
    get:
      tags: [Dev]
      summary: Read the most recent mock email for a user
      description: |
        DEV ONLY. Disabled in production. Lets test scripts read the most
        recent mock email of a given kind, e.g. to grab a verification code.
      security: []
      parameters:
        - name: email
          in: query
          required: true
          schema: { type: string, format: email }
        - name: kind
          in: query
          required: false
          schema: { type: string, enum: [verification, reset] }
      responses:
        '200':
          description: Email record.
        '404':
          description: No email found (or running in production).

  # ───────────────────────────────────────────────────────────────────────
  # Profiles
  # ───────────────────────────────────────────────────────────────────────
  /api/profiles/me:
    get:
      tags: [Profiles]
      summary: Full profile of the current user
      responses:
        '200':
          description: Full profile object.
          content:
            application/json:
              schema:
                type: object
                properties:
                  profile: { $ref: '#/components/schemas/Profile' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    patch:
      tags: [Profiles]
      summary: Update header fields & profile metadata
      description: |
        Any subset of the documented fields may be patched. Fields not in the
        whitelist are ignored.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProfilePatch' }
      responses:
        '200':
          description: Updated profile (full re-fetch).
          content:
            application/json:
              schema:
                type: object
                properties: { profile: { $ref: '#/components/schemas/Profile' } }
        '400': { $ref: '#/components/responses/BadRequest' }

  /api/profiles/{id}:
    get:
      tags: [Profiles]
      summary: Public profile of any user (incl. self)
      description: |
        Returns the same shape as `/profiles/me`, with email omitted unless
        the viewer is the owner. Credential document URLs only appear if the
        owner has shared them publicly or the viewer is the owner.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Profile.
          content:
            application/json:
              schema:
                type: object
                properties: { profile: { $ref: '#/components/schemas/Profile' } }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/profiles/me/trades:
    post:
      tags: [Profiles]
      summary: Replace the user's trade list (atomic)
      description: |
        Whole-list replacement. Up to 6 entries; the first is the primary.
        Trades not in the canonical catalog are created on the fly.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                trades:
                  type: array
                  maxItems: 6
                  items:
                    type: object
                    required: [name]
                    properties:
                      name: { type: string }
                      years: { type: integer, minimum: 0 }
      responses:
        '200':
          description: Updated profile.
          content:
            application/json:
              schema:
                type: object
                properties: { profile: { $ref: '#/components/schemas/Profile' } }

  /api/profiles/me/licenses:
    post:
      tags: [Profiles]
      summary: Add a license / credential
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, number, expiration]
              properties:
                name: { type: string, example: "UT Contractor License" }
                number: { type: string }
                expiration:
                  type: string
                  pattern: '^\d{4}-(0[1-9]|1[0-2])$'
                  description: "YYYY-MM format."
                verified: { type: boolean, default: false }
                doc_url:
                  type: string
                  nullable: true
                  description: Filename returned by POST /api/credential-docs.
                doc_mime: { type: string, nullable: true }
                share_public: { type: boolean, default: false }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  license: { $ref: '#/components/schemas/License' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /api/profiles/me/licenses/{lid}:
    patch:
      tags: [Profiles]
      summary: Update an existing license
      description: |
        Used to toggle `share_public`, attach a newly uploaded doc, or edit
        fields. Patch fields not in the allowed list are ignored.
      parameters:
        - { name: lid, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                number: { type: string }
                expiration: { type: string, pattern: '^\d{4}-(0[1-9]|1[0-2])$' }
                doc_url: { type: string, nullable: true }
                doc_mime: { type: string, nullable: true }
                share_public: { type: boolean }
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema:
                type: object
                properties: { ok: { type: boolean } }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Profiles]
      summary: Remove a license
      parameters:
        - { name: lid, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: Deleted.
          content:
            application/json:
              schema:
                type: object
                properties: { ok: { type: boolean } }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/profiles/me/skills:
    post:
      tags: [Profiles]
      summary: Replace the user's skill list (atomic)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                skills:
                  type: array
                  items:
                    type: object
                    required: [name]
                    properties:
                      name: { type: string }
                      level: { type: integer, minimum: 1, maximum: 5 }
      responses:
        '200':
          description: Updated profile.

  /api/profiles/{id}/skills/{sid}/endorse:
    post:
      tags: [Profiles]
      summary: Endorse another user's skill
      description: |
        Idempotent — repeat POSTs don't double-count. Fires a notification
        the first time. Self-endorsement returns 400.
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: sid, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: Endorsed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  endorsed_by_me: { type: boolean }
                  endorsements: { type: integer }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Profiles]
      summary: Un-endorse a skill
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: sid, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: Removed.

  /api/profiles/{id}/skills/{sid}/endorsers:
    get:
      tags: [Profiles]
      summary: List the people who've endorsed a skill
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: sid, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: Endorser list.
          content:
            application/json:
              schema:
                type: object
                properties:
                  endorsers:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer }
                        name: { type: string }
                        initials: { type: string }
                        headline: { type: string, nullable: true }
                        avatar_tone: { $ref: '#/components/schemas/AvatarTone' }
                        created_at: { type: string, format: date-time }

  /api/profiles/me/strength:
    get:
      tags: [Profiles]
      summary: Profile-strength widget data
      description: Returns a 0-100 percent score and a checklist of unmet items.
      responses:
        '200':
          description: Strength.
          content:
            application/json:
              schema:
                type: object
                properties:
                  pct: { type: integer, minimum: 0, maximum: 100 }
                  checklist:
                    type: array
                    items:
                      type: object
                      properties:
                        key: { type: string }
                        label: { type: string }
                        done: { type: boolean }

  # ───────────────────────────────────────────────────────────────────────
  # Companies + Work history + Jobsites
  # ───────────────────────────────────────────────────────────────────────
  /api/companies:
    get:
      tags: [Companies]
      summary: Search the company directory (autocomplete)
      parameters:
        - { name: search, in: query, required: false, schema: { type: string } }
      responses:
        '200':
          description: Matching companies.
          content:
            application/json:
              schema:
                type: object
                properties:
                  companies:
                    type: array
                    items: { $ref: '#/components/schemas/Company' }
    post:
      tags: [Companies]
      summary: Create a new company (claim optional)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                type: { type: string, default: "General Contractor" }
                logo_tone: { $ref: '#/components/schemas/AvatarTone' }
                claim: { type: boolean, default: false }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  company: { $ref: '#/components/schemas/Company' }

  /api/companies/{id}/claim:
    post:
      tags: [Companies]
      summary: Claim an unclaimed company
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: Claimed.
        '409':
          description: Already claimed.

  /api/work-history:
    post:
      tags: [Companies]
      summary: Add a tenure at a company
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [company_id, role, from_year]
              properties:
                company_id: { type: integer }
                role: { type: string, example: "Lead Carpenter" }
                from_year: { type: string, example: "2021" }
                to_year: { type: string, nullable: true, example: "2024" }
                is_current: { type: boolean, default: false }
                jobsites:
                  type: array
                  description: Optional bulk-add jobsites in the same request.
                  items: { $ref: '#/components/schemas/JobsiteInput' }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  work_history_id: { type: integer }

  /api/work-history/{id}:
    delete:
      tags: [Companies]
      summary: Remove a work-history entry (cascades to its jobsites)
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: Deleted.
        '404': { $ref: '#/components/responses/NotFound' }

  /api/work-history/{id}/jobsites:
    post:
      tags: [Companies]
      summary: Append a jobsite to a work-history entry
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/JobsiteInput' }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  jobsite: { $ref: '#/components/schemas/Jobsite' }

  /api/jobsites/{id}:
    delete:
      tags: [Companies]
      summary: Remove a jobsite
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: Deleted.
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Companies]
      summary: Edit a jobsite (toggle featured, etc.)
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string }
                kind: { type: string }
                location: { type: string }
                duration: { type: string }
                photo_kind: { $ref: '#/components/schemas/PhotoKind' }
                is_featured: { type: boolean }
      responses:
        '200':
          description: Updated.

  # ───────────────────────────────────────────────────────────────────────
  # Connections
  # ───────────────────────────────────────────────────────────────────────
  /api/connections:
    get:
      tags: [Connections]
      summary: List the viewer's accepted connections
      responses:
        '200':
          description: Connections list.
          content:
            application/json:
              schema:
                type: object
                properties:
                  connections:
                    type: array
                    items: { $ref: '#/components/schemas/ConnectionCard' }

  /api/connections/pending:
    get:
      tags: [Connections]
      summary: Incoming connection requests
      responses:
        '200':
          description: Pending list.
          content:
            application/json:
              schema:
                type: object
                properties:
                  pending:
                    type: array
                    items:
                      allOf:
                        - $ref: '#/components/schemas/ConnectionCard'
                        - type: object
                          properties:
                            connection_id: { type: integer }
                            created_at: { type: string, format: date-time }

  /api/connections/suggestions:
    get:
      tags: [Connections]
      summary: "People you may know"
      description: |
        Prefers 2nd-degree (friends-of-friends), falls back to same-location.
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, default: 12, minimum: 1, maximum: 50 }
      responses:
        '200':
          description: Suggestions list.
          content:
            application/json:
              schema:
                type: object
                properties:
                  suggestions:
                    type: array
                    items: { $ref: '#/components/schemas/ConnectionCard' }

  /api/connections/request:
    post:
      tags: [Connections]
      summary: Send a connection request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [target_id]
              properties:
                target_id: { type: integer }
      responses:
        '201':
          description: Sent.
        '200':
          description: Already sent / already connected (idempotent).
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/connections/{id}/accept:
    post:
      tags: [Connections]
      summary: Accept an incoming request
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { description: Accepted. }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/connections/{id}/reject:
    post:
      tags: [Connections]
      summary: Reject an incoming request
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { description: Rejected. }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/connections/{id}:
    delete:
      tags: [Connections]
      summary: Disconnect (remove an accepted connection)
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { description: Disconnected (or no-op). }

  # ───────────────────────────────────────────────────────────────────────
  # Posts (Feed)
  # ───────────────────────────────────────────────────────────────────────
  /api/posts/feed:
    get:
      tags: [Posts]
      summary: Feed of posts
      parameters:
        - name: scope
          in: query
          schema: { type: string, enum: [network, all], default: network }
        - name: limit
          in: query
          schema: { type: integer, default: 20, minimum: 1, maximum: 50 }
        - name: offset
          in: query
          schema: { type: integer, default: 0, minimum: 0 }
      responses:
        '200':
          description: Posts.
          content:
            application/json:
              schema:
                type: object
                properties:
                  posts:
                    type: array
                    items: { $ref: '#/components/schemas/Post' }

  /api/posts/by-user/{id}:
    get:
      tags: [Posts]
      summary: Posts by a specific user
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: limit, in: query, schema: { type: integer, default: 20 } }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
      responses:
        '200':
          description: Posts.

  /api/posts:
    post:
      tags: [Posts]
      summary: Create a post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                type: { type: string, enum: [project, hiring, milestone, photo], default: project }
                body: { type: string }
                project_name: { type: string, nullable: true }
                milestone: { type: string, nullable: true }
                photos:
                  type: array
                  maxItems: 4
                  items: { $ref: '#/components/schemas/PhotoKind' }
                tags:
                  type: array
                  maxItems: 6
                  items: { type: string }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                type: object
                properties: { post: { $ref: '#/components/schemas/Post' } }
        '400': { $ref: '#/components/responses/BadRequest' }

  /api/posts/{id}:
    delete:
      tags: [Posts]
      summary: Delete a post (author only)
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { description: Deleted. }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/posts/{id}/like:
    post:
      tags: [Posts]
      summary: Toggle like on a post
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: New liked-state.
          content:
            application/json:
              schema:
                type: object
                properties: { liked: { type: boolean } }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/posts/{id}/comments:
    get:
      tags: [Posts]
      summary: List comments on a post
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: Comments.
          content:
            application/json:
              schema:
                type: object
                properties:
                  comments:
                    type: array
                    items: { $ref: '#/components/schemas/Comment' }
    post:
      tags: [Posts]
      summary: Add a comment
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: { type: string, maxLength: 2000 }
      responses:
        '201':
          description: Created.

  # ───────────────────────────────────────────────────────────────────────
  # Messages
  # ───────────────────────────────────────────────────────────────────────
  /api/messages/threads:
    get:
      tags: [Messages]
      summary: List the user's message threads with last-message + unread count
      responses:
        '200':
          description: Threads.
          content:
            application/json:
              schema:
                type: object
                properties:
                  threads:
                    type: array
                    items: { $ref: '#/components/schemas/ThreadSummary' }
    post:
      tags: [Messages]
      summary: Create or fetch a 1:1 thread with a connection
      description: |
        Idempotent. If a 1:1 thread between the viewer and `peer_id` already
        exists, returns it (with `created: false`). Connection-required —
        non-connections get 403.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [peer_id]
              properties:
                peer_id: { type: integer }
      responses:
        '200':
          description: Existing thread returned.
        '201':
          description: New thread created.
        '403':
          description: Peer is not a connection.

  /api/messages/threads/{id}:
    get:
      tags: [Messages]
      summary: Get a thread + recent messages
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - name: before
          in: query
          schema: { type: integer }
          description: Paginate older — fetch messages with id < this.
        - name: limit
          in: query
          schema: { type: integer, default: 50, minimum: 1, maximum: 200 }
      responses:
        '200':
          description: Thread.
          content:
            application/json:
              schema:
                type: object
                properties: { thread: { $ref: '#/components/schemas/Thread' } }
        '404':
          description: Thread not found (or not a participant).

  /api/messages/threads/{id}/messages:
    post:
      tags: [Messages]
      summary: Send a message in a thread
      description: |
        The HTTP POST is the durable source of truth. After the DB insert
        succeeds, the message is broadcast to any open recipient websockets
        on `/api/ws` — but the message is safe even if no socket is listening.
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: { type: string, maxLength: 5000, minLength: 1 }
      responses:
        '201':
          description: Sent.
          content:
            application/json:
              schema:
                type: object
                properties: { message: { $ref: '#/components/schemas/Message' } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403':
          description: Connection required (or no longer connected).

  /api/messages/threads/{id}/read:
    post:
      tags: [Messages]
      summary: Mark thread as read (sets last_read_at = now)
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { description: Marked. }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/messages/unread-count:
    get:
      tags: [Messages]
      summary: Total unread messages across all threads (drives nav badge)
      responses:
        '200':
          description: Unread count.
          content:
            application/json:
              schema:
                type: object
                properties: { unread: { type: integer } }

  # ───────────────────────────────────────────────────────────────────────
  # News
  # ───────────────────────────────────────────────────────────────────────
  /api/news:
    get:
      tags: [News]
      summary: List news articles (filterable)
      parameters:
        - { name: category, in: query, schema: { type: string } }
        - { name: tag, in: query, schema: { type: string } }
        - { name: q, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, default: 24, maximum: 60 } }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
      responses:
        '200':
          description: Articles.
          content:
            application/json:
              schema:
                type: object
                properties:
                  articles:
                    type: array
                    items: { $ref: '#/components/schemas/NewsArticle' }

  /api/news/categories:
    get:
      tags: [News]
      summary: Categories with article counts
      responses:
        '200':
          description: Categories.
          content:
            application/json:
              schema:
                type: object
                properties:
                  categories:
                    type: array
                    items:
                      type: object
                      properties:
                        name: { type: string, example: "The Trade" }
                        count: { type: integer }

  /api/news/tags:
    get:
      tags: [News]
      summary: Top tags with counts
      responses:
        '200':
          description: Tags.
          content:
            application/json:
              schema:
                type: object
                properties:
                  tags:
                    type: array
                    items:
                      type: object
                      properties:
                        tag: { type: string }
                        n: { type: integer }

  /api/news/featured:
    get:
      tags: [News]
      summary: Hand-pinned featured articles for the hero strip
      responses:
        '200':
          description: Articles (max 6).

  /api/news/for-you:
    get:
      tags: [News]
      summary: Articles matching the user's trades
      parameters:
        - { name: limit, in: query, schema: { type: integer, default: 8, maximum: 20 } }
      responses:
        '200':
          description: Personalized articles.

  /api/news/saved:
    get:
      tags: [News]
      summary: The user's saved-for-later articles
      responses:
        '200':
          description: Saved articles, most recently saved first.

  /api/news/{id}/save:
    post:
      tags: [News]
      summary: Bookmark an article
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { description: Saved (idempotent). }
        '404':
          description: Article not found.
    delete:
      tags: [News]
      summary: Un-bookmark an article
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { description: Removed (idempotent). }

  # ───────────────────────────────────────────────────────────────────────
  # Search + Notifications + Trades
  # ───────────────────────────────────────────────────────────────────────
  /api/search:
    get:
      tags: [Search]
      summary: Unified search across users, companies, jobsites, trades
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, minLength: 2 } }
      responses:
        '200':
          description: Mixed results. Each subarray is capped at 10.
          content:
            application/json:
              schema:
                type: object
                properties:
                  users: { type: array, items: { type: object } }
                  companies: { type: array, items: { $ref: '#/components/schemas/Company' } }
                  jobsites: { type: array, items: { type: object } }
                  trades: { type: array, items: { type: object } }

  /api/notifications:
    get:
      tags: [Notifications]
      summary: List the user's notifications (most recent 50) + unread count
      responses:
        '200':
          description: Notifications.
          content:
            application/json:
              schema:
                type: object
                properties:
                  unread: { type: integer }
                  notifications:
                    type: array
                    items: { $ref: '#/components/schemas/Notification' }

  /api/notifications/read:
    post:
      tags: [Notifications]
      summary: Mark all notifications as read
      responses:
        '200': { description: All marked. }

  /api/trades:
    get:
      tags: [Misc]
      summary: Canonical trades catalog (powers onboarding)
      security: []
      responses:
        '200':
          description: Trades.
          content:
            application/json:
              schema:
                type: object
                properties:
                  trades:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer }
                        name: { type: string }
                        icon: { type: string }

  # ───────────────────────────────────────────────────────────────────────
  # Credential Docs
  # ───────────────────────────────────────────────────────────────────────
  /api/credential-docs:
    post:
      tags: [Credential Docs]
      summary: Upload a credential document
      description: |
        Multipart upload. Field name `file`. Returns a filename to attach
        to a license or insurance record via PATCH.
        Accepted MIME: `application/pdf`, `image/jpeg`, `image/png`. Max 8 MB.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '201':
          description: Uploaded.
          content:
            application/json:
              schema:
                type: object
                properties:
                  filename: { type: string }
                  mime: { type: string }
                  size: { type: integer }
        '400': { $ref: '#/components/responses/BadRequest' }

  /api/credential-docs/{filename}:
    get:
      tags: [Credential Docs]
      summary: Serve a credential document
      description: |
        Auth-gated. The owner can always view their docs; others can only view
        when the doc has `share_public = TRUE`.
      parameters:
        - { name: filename, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: File stream.
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ───────────────────────────────────────────────────────────────────────
  # Admin (require is_admin = TRUE)
  # ───────────────────────────────────────────────────────────────────────
  /api/admin/news/feeds:
    get:
      tags: [Admin]
      summary: List RSS feeds + health
      responses:
        '200': { description: Feeds. }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Admin]
      summary: Add an RSS feed
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, url, category]
              properties:
                name: { type: string }
                url: { type: string, format: uri }
                category: { type: string }
                default_tags:
                  type: array
                  items: { type: string }
      responses:
        '201': { description: Added (or upserted by URL). }

  /api/admin/news/feeds/{id}:
    patch:
      tags: [Admin]
      summary: Enable / disable a feed, rename, etc.
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                enabled: { type: boolean }
                category: { type: string }
                name: { type: string }
                default_tags: { type: array, items: { type: string } }
      responses:
        '200': { description: Updated. }

  /api/admin/news/ingest:
    post:
      tags: [Admin]
      summary: Run the news ingestion pipeline now
      responses:
        '200': { description: Done. }

  /api/admin/news/{id}:
    patch:
      tags: [Admin]
      summary: Toggle featured / hidden on an article (curate)
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                featured: { type: boolean }
                hidden: { type: boolean }
                category: { type: string }
                tags: { type: array, items: { type: string } }
                image_kind: { $ref: '#/components/schemas/PhotoKind' }
      responses:
        '200': { description: Updated. }

# ───────────────────────────────────────────────────────────────────────────
# Components
# ───────────────────────────────────────────────────────────────────────────
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Send the JWT returned by `/api/auth/signin` or `/api/auth/signup` as
        `Authorization: Bearer <token>`. Token lifetime is 7 days.

  responses:
    BadRequest:
      description: Request validation failed.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: Missing or invalid auth token.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Authenticated, but not permitted.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    Error:
      type: object
      properties:
        error: { type: string, description: Human-readable error message. }

    AvatarTone:
      type: string
      enum: [wood, rust, steel, brick, sage, sand, slate, cream]
      description: |
        Categorical color for avatar/logo backgrounds. New tones may be added;
        existing tones never change meaning.

    PhotoKind:
      type: string
      enum: [concrete, wood, steel, frame, roof, brick, sky, crew, blueprint, tile, kitchen, workshop]
      description: |
        Placeholder photo categories. Used for jobsite photos, post photos,
        and cover photos. New kinds may be added; existing kinds never change.

    UserMinimal:
      type: object
      properties:
        id: { type: integer }
        email: { type: string, format: email }
        email_verified: { type: boolean }
        onboarding_done: { type: boolean }

    UserSelf:
      type: object
      properties:
        id: { type: integer }
        email: { type: string, format: email }
        email_verified: { type: boolean }
        first_name: { type: string }
        last_name: { type: string }
        headline: { type: string, nullable: true }
        location: { type: string, nullable: true }
        onboarding_step: { type: integer }
        onboarding_done: { type: boolean }
        avatar_tone: { $ref: '#/components/schemas/AvatarTone' }
        verified_smith: { type: boolean }

    Profile:
      type: object
      properties:
        id: { type: integer }
        email: { type: string, format: email, nullable: true, description: Only present when viewing your own profile. }
        name: { type: string, description: "first_name + ' ' + last_name" }
        initials: { type: string }
        first_name: { type: string }
        last_name: { type: string }
        headline: { type: string, nullable: true }
        location: { type: string, nullable: true }
        about: { type: string, nullable: true }
        avatar_tone: { $ref: '#/components/schemas/AvatarTone' }
        cover_kind: { $ref: '#/components/schemas/PhotoKind' }
        verified_smith: { type: boolean }
        years_experience: { type: integer }
        union:
          type: object
          nullable: true
          properties:
            name: { type: string }
            since: { type: string }
        apprentice:
          type: object
          properties:
            hours: { type: integer }
            required: { type: integer }
            status: { type: string, enum: [Apprentice, Journeyman, Master] }
        insurance:
          type: object
          nullable: true
          properties:
            carrier: { type: string }
            limit: { type: string }
            verified: { type: boolean }
            share_public: { type: boolean }
            doc_url: { type: string, nullable: true }
            doc_mime: { type: string, nullable: true }
            has_doc: { type: boolean }
        onboarding:
          type: object
          properties:
            step: { type: integer }
            done: { type: boolean }
        trades:
          type: array
          items: { $ref: '#/components/schemas/Trade' }
        licenses:
          type: array
          items: { $ref: '#/components/schemas/License' }
        work_history:
          type: array
          items: { $ref: '#/components/schemas/WorkHistory' }
        skills:
          type: array
          items: { $ref: '#/components/schemas/Skill' }
        network_size: { type: integer }
        connection:
          nullable: true
          type: object
          properties:
            status: { type: string, enum: [pending, accepted] }
            requested_by: { type: integer }

    ProfilePatch:
      type: object
      description: |
        Partial update. Any subset of these fields. Fields not whitelisted
        are silently ignored.
      properties:
        first_name: { type: string }
        last_name: { type: string }
        headline: { type: string }
        location: { type: string }
        about: { type: string }
        avatar_tone: { $ref: '#/components/schemas/AvatarTone' }
        cover_kind: { $ref: '#/components/schemas/PhotoKind' }
        years_experience: { type: integer }
        union_name: { type: string, nullable: true }
        union_member_since: { type: string, nullable: true }
        apprentice_hours: { type: integer }
        apprentice_required: { type: integer }
        apprentice_status: { type: string, enum: [Apprentice, Journeyman, Master] }
        insurance_carrier: { type: string, nullable: true }
        insurance_limit: { type: string, nullable: true }
        insurance_doc_url: { type: string, nullable: true }
        insurance_doc_mime: { type: string, nullable: true }
        insurance_share_public: { type: boolean }
        onboarding_step: { type: integer }
        onboarding_done: { type: boolean }

    Trade:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        icon: { type: string }
        years: { type: integer }
        position: { type: integer }

    Skill:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        level: { type: integer, minimum: 1, maximum: 5 }
        position: { type: integer }
        endorsements: { type: integer }
        endorsed_by_me: { type: boolean }

    License:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        number: { type: string }
        expiration: { type: string, pattern: '^\d{4}-(0[1-9]|1[0-2])$' }
        verified: { type: boolean }
        position: { type: integer }
        share_public: { type: boolean }
        doc_url:
          type: string
          nullable: true
          description: Full URL to the credential doc, or null if not uploaded / not shared.
        doc_mime: { type: string, nullable: true }
        has_doc:
          type: boolean
          description: |
            True if a doc has been uploaded AND the viewer can see it (owner
            always; others only if share_public).

    WorkHistory:
      type: object
      properties:
        id: { type: integer }
        role: { type: string }
        from_year: { type: string }
        to_year: { type: string, nullable: true }
        is_current: { type: boolean }
        position: { type: integer }
        company_id: { type: integer }
        company_name: { type: string }
        company_type: { type: string }
        company_logo_tone: { $ref: '#/components/schemas/AvatarTone' }
        company_claimed: { type: boolean }
        jobsites:
          type: array
          items: { $ref: '#/components/schemas/Jobsite' }

    JobsiteInput:
      type: object
      required: [title]
      properties:
        title: { type: string }
        kind: { type: string }
        location: { type: string }
        duration: { type: string }
        photo_kind: { $ref: '#/components/schemas/PhotoKind' }
        is_featured: { type: boolean, default: false }

    Jobsite:
      type: object
      properties:
        id: { type: integer }
        work_history_id: { type: integer }
        title: { type: string }
        kind: { type: string, nullable: true }
        location: { type: string, nullable: true }
        duration: { type: string, nullable: true }
        photo_kind: { $ref: '#/components/schemas/PhotoKind' }
        is_featured: { type: boolean }
        position: { type: integer }

    Company:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        type: { type: string }
        logo_tone: { $ref: '#/components/schemas/AvatarTone' }
        claimed: { type: boolean }

    ConnectionCard:
      type: object
      properties:
        id: { type: integer, description: User id. }
        first_name: { type: string }
        last_name: { type: string }
        headline: { type: string, nullable: true }
        location: { type: string, nullable: true }
        avatar_tone: { $ref: '#/components/schemas/AvatarTone' }
        company_name: { type: string, nullable: true }
        current_role: { type: string, nullable: true }
        mutual: { type: integer, description: Number of mutual connections. }

    Post:
      type: object
      properties:
        id: { type: integer }
        type: { type: string, enum: [project, hiring, milestone, photo] }
        body: { type: string }
        project_name: { type: string, nullable: true }
        milestone: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        author:
          type: object
          properties:
            id: { type: integer }
            name: { type: string }
            initials: { type: string }
            headline: { type: string, nullable: true }
            avatar_tone: { $ref: '#/components/schemas/AvatarTone' }
            verified: { type: boolean }
        photos:
          type: array
          items: { $ref: '#/components/schemas/PhotoKind' }
        tags:
          type: array
          items: { type: string }
        stats:
          type: object
          properties:
            likes: { type: integer }
            comments: { type: integer }
            liked_by_me: { type: boolean }

    Comment:
      type: object
      properties:
        id: { type: integer }
        body: { type: string }
        created_at: { type: string, format: date-time }
        author:
          type: object
          properties:
            id: { type: integer }
            name: { type: string }
            initials: { type: string }
            avatar_tone: { $ref: '#/components/schemas/AvatarTone' }
            headline: { type: string, nullable: true }

    ThreadSummary:
      type: object
      properties:
        id: { type: integer }
        last_message_at: { type: string, format: date-time }
        peer:
          type: object
          properties:
            id: { type: integer }
            first_name: { type: string }
            last_name: { type: string }
            avatar_tone: { $ref: '#/components/schemas/AvatarTone' }
            headline: { type: string, nullable: true }
        last_message:
          nullable: true
          type: object
          properties:
            body: { type: string }
            sender_id: { type: integer }
            created_at: { type: string, format: date-time }
            from_me: { type: boolean }
        unread: { type: integer }

    Thread:
      type: object
      properties:
        id: { type: integer }
        peer:
          type: object
          nullable: true
          properties:
            id: { type: integer }
            first_name: { type: string }
            last_name: { type: string }
            avatar_tone: { $ref: '#/components/schemas/AvatarTone' }
            headline: { type: string, nullable: true }
        messages:
          type: array
          items: { $ref: '#/components/schemas/Message' }
        has_more: { type: boolean }

    Message:
      type: object
      properties:
        id: { type: integer }
        sender_id: { type: integer }
        body: { type: string }
        created_at: { type: string, format: date-time }
        from_me: { type: boolean }

    NewsArticle:
      type: object
      properties:
        id: { type: integer }
        title: { type: string }
        summary: { type: string, nullable: true }
        source: { type: string }
        source_url: { type: string, format: uri }
        author: { type: string, nullable: true }
        published_at: { type: string, format: date-time }
        read_minutes: { type: integer, nullable: true }
        image_kind: { $ref: '#/components/schemas/PhotoKind' }
        category: { type: string }
        tags:
          type: array
          items: { type: string }
        featured: { type: boolean }
        saved_by_me: { type: boolean }

    Notification:
      type: object
      properties:
        id: { type: integer }
        kind:
          type: string
          enum: [connection_request, connection_accepted, post_like, post_comment, skill_endorse, new_message]
          description: New notification kinds may be added; existing kinds never change.
        body: { type: string }
        read_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
        actor:
          nullable: true
          type: object
          properties:
            id: { type: integer }
            name: { type: string }
            initials: { type: string }
            avatar_tone: { $ref: '#/components/schemas/AvatarTone' }

security:
  - bearerAuth: []
